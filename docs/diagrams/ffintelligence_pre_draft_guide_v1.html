<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #ffffff;
      color: #1a2a36;
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
    }
    body { padding: 1.25rem; }
    .container { max-width: 1400px; margin: 0 auto; }
    .header { margin-bottom: 1rem; }
    .header-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem; }
    h1 {
      font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 700;
      letter-spacing: -0.02em; color: #0b1a26; text-transform: uppercase;
    }
    h1 .accent { color: #15820b; }
    .subtitle {
      font-family: 'Manrope', sans-serif; font-size: 0.82rem; color: #687684;
      text-transform: uppercase; letter-spacing: 0.14em;
    }
    .meta { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: #8a97a3; margin-top: 0.3rem; }
    .diagram-container {
      background: #f6f8fb;
      border-radius: 10px;
      padding: 0.75rem;
      border: 1px solid #d5dce4;
      overflow: auto;
    }
    svg { display: block; width: 100%; height: auto; min-width: 1400px; }
    .footer {
      text-align: center; margin-top: 0.6rem; color: #8a97a3; font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace; letter-spacing: 0.08em;
    }
    @media print {
      @page { size: 17in 11in; margin: 0.35in; }
      body { padding: 0; background: #ffffff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .container { max-width: 100%; }
      .diagram-container { overflow: visible; border: none; padding: 0; background: #ffffff; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <h1>FF<span class="accent">Intelligence</span> — Pre-Draft Research Guide</h1>
      </div>
      <div class="subtitle">Days/weeks before your draft · Output = personalized board + strategy</div>
      <div class="meta">v1 · 2026-04-14 · Print on tabloid landscape (17"×11")</div>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#2c4785"/>
          </marker>
          <marker id="arrLime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#15820b"/>
          </marker>
        </defs>

        <!-- Page background -->
        <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>

        <!-- ============================================== -->
        <!-- LEGEND BAR                                      -->
        <!-- ============================================== -->
        <rect x="20" y="20" width="1360" height="74" rx="8" fill="#ffffff" stroke="#d5dce4"/>

        <g font-family="Manrope" font-size="10" fill="#1a2a36">

          <!-- Arrow -->
          <path d="M 1030 68 L 1110 68" stroke="#15820b" stroke-width="2" marker-end="url(#arrLime)"/>
          <text x="1128" y="72">Next step</text>
        </g>

        <!-- ============================================== -->
        <!-- SECTION A HEADER                                -->
        <!-- ============================================== -->
        <g>
          <rect x="20" y="108" width="1360" height="50" rx="8" fill="#eef2fb" stroke="#2c4785" stroke-opacity="0.55"/>
          <circle cx="50" cy="133" r="16" fill="#ffffff" stroke="#2c4785" stroke-width="1.5"/>
          <text x="50" y="139" font-family="Space Grotesk" font-size="14" font-weight="700" fill="#2c4785" text-anchor="middle">A</text>
          <text x="80" y="130" font-family="Space Grotesk" font-size="18" font-weight="700" fill="#0b1a26">PRE-DRAFT RESEARCH WORKFLOW</text>
          <text x="80" y="148" font-family="Manrope" font-size="11" fill="#687684">6 steps · ~15–30 min first time · ~5 min on re-runs · Output: personalized draft board + strategy</text>
          <text x="1340" y="139" font-family="JetBrains Mono" font-size="10" fill="#2c4785" text-anchor="end">Repeat before every draft season</text>
        </g>

        <!-- Step cards: 215 wide x 290 tall, gap 10 -->

        <!-- STEP 1: Open App -->
        <g>
          <rect x="20" y="175" width="215" height="290" rx="10" fill="#ffffff" stroke="#2c4785" stroke-opacity="0.45"/>
          <circle cx="50" cy="200" r="13" fill="#eef2fb" stroke="#2c4785" stroke-width="1.5"/>
          <text x="50" y="204" font-family="Space Grotesk" font-size="12" font-weight="700" fill="#2c4785" text-anchor="middle">1</text>
          <text x="73" y="198" font-family="Space Grotesk" font-size="13" font-weight="700" fill="#0b1a26">OPEN APP</text>
          <text x="73" y="212" font-family="Manrope" font-size="9" fill="#687684">Sign in → Prep Hub</text>

          <text x="32" y="238" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#687684" letter-spacing="1">WHAT YOU SEE</text>
          <rect x="32" y="245" width="190" height="24" rx="4" fill="#f1f4f8" stroke="#8a97a3" stroke-opacity="0.5"/>
          <text x="42" y="261" font-family="JetBrains Mono" font-size="9" fill="#0b1a26">⚡ Optimize Your Edge</text>
          <rect x="32" y="273" width="190" height="22" rx="4" fill="#f1f4f8" stroke="#8a97a3" stroke-opacity="0.5"/>

          <rect x="32" y="325" width="190" height="22" rx="4" fill="#f1f4f8" stroke="#8a97a3" stroke-opacity="0.5"/>
          <text x="42" y="340" font-family="Manrope" font-size="9" fill="#0b1a26">◆ Runs</text>

          <text x="32" y="370" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#687684" letter-spacing="1">DO THIS</text>
          <text x="32" y="387" font-family="Manrope" font-size="10" fill="#1a2a36">☞ Bottom nav: tap PREP</text>
          <text x="32" y="402" font-family="Manrope" font-size="10" fill="#1a2a36">☞ Verify correct league</text>
          <text x="32" y="415" font-family="Manrope" font-size="10" fill="#1a2a36">   is selected at top</text>

          <rect x="32" y="428" width="190" height="28" rx="4" fill="#eaf7e4" stroke="#15820b" stroke-opacity="0.5"/>
          <text x="42" y="440" font-family="Space Grotesk" font-size="8" font-weight="700" fill="#15820b" letter-spacing="1">◆ PRO TIP</text>
          <text x="42" y="452" font-family="Manrope" font-size="9" fill="#1a2a36">One league per Prep session</text>
        </g>

        <!-- STEP 2: Configure League -->
        <g>
          <rect x="245" y="175" width="215" height="290" rx="10" fill="#ffffff" stroke="#2c4785" stroke-opacity="0.45"/>
          <circle cx="275" cy="200" r="13" fill="#eef2fb" stroke="#2c4785" stroke-width="1.5"/>
          <text x="275" y="204" font-family="Space Grotesk" font-size="12" font-weight="700" fill="#2c4785" text-anchor="middle">2</text>
          <text x="298" y="198" font-family="Space Grotesk" font-size="13" font-weight="700" fill="#0b1a26">CONFIGURE LEAGUE</text>
          <text x="298" y="212" font-family="Manrope" font-size="9" fill="#687684">One-time setup (edit anytime)</text>

          <text x="257" y="238" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#687684" letter-spacing="1">WHERE</text>
          <rect x="257" y="245" width="190" height="22" rx="4" fill="#eef2fb" stroke="#2c4785" stroke-opacity="0.4"/>
          <text x="267" y="260" font-family="Manrope" font-size="10" fill="#2c4785">Settings → League</text>

          <text x="257" y="286" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#687684" letter-spacing="1">FIELDS</text>
          <text x="257" y="302" font-family="Manrope" font-size="10" fill="#1a2a36">• Platform (ESPN / Yahoo)</text>
          <text x="257" y="316" font-family="Manrope" font-size="10" fill="#1a2a36">• Format (Auction / Snake)</text>
          <text x="257" y="330" font-family="Manrope" font-size="10" fill="#1a2a36">• Size (8 / 10 / 12 / 14)</text>
          <text x="257" y="344" font-family="Manrope" font-size="10" fill="#1a2a36">• Budget or Rounds</text>
          <text x="257" y="358" font-family="Manrope" font-size="10" fill="#1a2a36">• Roster construction</text>
          <text x="257" y="372" font-family="Manrope" font-size="10" fill="#1a2a36">• Scoring (PPR, 0.5, std)</text>
          <text x="257" y="386" font-family="Manrope" font-size="10" fill="#1a2a36">• Keepers (optional)</text>

          <rect x="257" y="400" width="190" height="28" rx="4" fill="#fef3f2" stroke="#c93024" stroke-opacity="0.5"/>

          <text x="267" y="424" font-family="Manrope" font-size="9" fill="#1a2a36">Wrong scoring = wrong values</text>

          <rect x="257" y="434" width="190" height="22" rx="4" fill="#fcf8ed" stroke="#8f6c1e" stroke-opacity="0.4"/>
          <text x="267" y="448" font-family="Manrope" font-size="9" fill="#8f6c1e">▾ Expand "Advanced" for TE-prem, bench</text>
        </g>

        <!-- STEP 3: Run Research (LLM) -->
        <g>
          <rect x="470" y="175" width="215" height="290" rx="10" fill="#f3fbef" stroke="#15820b" stroke-width="1.5"/>

          <text x="482" y="300" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#687684" letter-spacing="1">WHAT IT DOES</text>
          <text x="482" y="316" font-family="Manrope" font-size="9" fill="#1a2a36">• Pulls ESPN + Yahoo + Sleeper</text>
          <text x="482" y="328" font-family="Manrope" font-size="9" fill="#1a2a36">  + FantasyPros rankings</text>
          <text x="482" y="342" font-family="Manrope" font-size="9" fill="#1a2a36">• Merges into consensus</text>
          <text x="482" y="356" font-family="Manrope" font-size="9" fill="#1a2a36">• Claude analyzes for league</text>
          <text x="482" y="370" font-family="Manrope" font-size="9" fill="#1a2a36">• Tags players (BREAKOUT /</text>
          <text x="482" y="382" font-family="Manrope" font-size="9" fill="#1a2a36">  SLEEPER / VALUE / BUST / AVOID)</text>

          <rect x="482" y="396" width="190" height="28" rx="4" fill="#eaf7e4" stroke="#15820b" stroke-opacity="0.5"/>
          <text x="492" y="408" font-family="Space Grotesk" font-size="8" font-weight="700" fill="#15820b" letter-spacing="1">◆ PRO TIP</text>
          <text x="492" y="420" font-family="Manrope" font-size="9" fill="#1a2a36">Takes 30–60s · worth it</text>

          <rect x="482" y="430" width="190" height="28" rx="4" fill="#fef3f2" stroke="#c93024" stroke-opacity="0.5"/>
          <text x="492" y="442" font-family="Space Grotesk" font-size="8" font-weight="700" fill="#c93024" letter-spacing="1">! COST</text>
          <text x="492" y="454" font-family="Manrope" font-size="9" fill="#1a2a36">Don't re-run unless data stale</text>
        </g>

        <!-- STEP 4: Browse Board -->
        <g>
          <rect x="695" y="175" width="215" height="290" rx="10" fill="#ffffff" stroke="#2c4785" stroke-opacity="0.45"/>
          <circle cx="725" cy="200" r="13" fill="#eef2fb" stroke="#2c4785" stroke-width="1.5"/>

          <text x="748" y="198" font-family="Space Grotesk" font-size="13" font-weight="700" fill="#0b1a26">BROWSE BOARD</text>
          <text x="748" y="212" font-family="Manrope" font-size="9" fill="#687684">Learn your personalized list</text>

          <text x="707" y="238" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#687684" letter-spacing="1">POSITION FILTERS</text>

            <rect x="707" y="245" width="30" height="18" rx="9" fill="#eaf7e4" stroke="#15820b" stroke-opacity="0.5"/>
            <text x="722" y="258" fill="#15820b">ALL</text>
            <rect x="740" y="245" width="26" height="18" rx="9" fill="#f1f4f8" stroke="#8a97a3" stroke-opacity="0.5"/>
            <text x="753" y="258" fill="#687684">QB</text>
            <rect x="769" y="245" width="26" height="18" rx="9" fill="#f1f4f8" stroke="#8a97a3" stroke-opacity="0.5"/>
            <text x="782" y="258" fill="#687684">RB</text>
            <rect x="798" y="245" width="26" height="18" rx="9" fill="#f1f4f8" stroke="#8a97a3" stroke-opacity="0.5"/>
            <text x="811" y="258" fill="#687684">WR</text>
            <rect x="827" y="245" width="24" height="18" rx="9" fill="#f1f4f8" stroke="#8a97a3" stroke-opacity="0.5"/>
            <text x="839" y="258" fill="#687684">TE</text>
            <rect x="854" y="245" width="24" height="18" rx="9" fill="#f1f4f8" stroke="#8a97a3" stroke-opacity="0.5"/>
            <text x="866" y="258" fill="#687684">K</text>
            <rect x="881" y="245" width="17" height="18" rx="9" fill="#f1f4f8" stroke="#8a97a3" stroke-opacity="0.5"/>
            <text x="889" y="258" fill="#687684">D</text>
          </g>

          <text x="707" y="285" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#687684" letter-spacing="1">PLAYER CARD ANATOMY</text>
          <rect x="707" y="293" width="190" height="58" rx="5" fill="#f6f8fb" stroke="#2c4785" stroke-opacity="0.4"/>
          <text x="717" y="310" font-family="Space Grotesk" font-size="18" font-weight="700" fill="#2c4785" fill-opacity="0.35" font-style="italic">01</text>
          <text x="745" y="309" font-family="Space Grotesk" font-size="10" font-weight="700" fill="#0b1a26">CMC</text>
          <text x="745" y="321" font-family="Manrope" font-size="8" fill="#687684" letter-spacing="1">SF · RB · BYE 9</text>
          <rect x="745" y="327" width="42" height="12" rx="6" fill="#eaf7e4" stroke="#15820b" stroke-opacity="0.5"/>
          <text x="766" y="336" font-family="JetBrains Mono" font-size="7" font-weight="700" fill="#15820b" text-anchor="middle">TARGET</text>
          <text x="870" y="311" font-family="Space Grotesk" font-size="12" font-weight="700" fill="#15820b" text-anchor="end">$72</text>
          <text x="870" y="322" font-family="Manrope" font-size="7" fill="#687684" text-anchor="end">$68–$76</text>
          <text x="885" y="338" font-family="Space Grotesk" font-size="11" fill="#8f6c1e" text-anchor="middle">▾</text>

          <text x="707" y="372" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#8f6c1e" letter-spacing="1">▾ TAP CARD TO EXPAND</text>
          <text x="707" y="388" font-family="Manrope" font-size="9" fill="#1a2a36">Reveals Tactical Insight:</text>
          <text x="707" y="400" font-family="Manrope" font-size="9" fill="#687684">• AI reasoning paragraph</text>
          <text x="707" y="412" font-family="Manrope" font-size="9" fill="#687684">• Confidence bar (94%)</text>
          <text x="707" y="424" font-family="Manrope" font-size="9" fill="#687684">• "FULL ANALYTICS" button</text>

          <rect x="707" y="434" width="190" height="24" rx="4" fill="#eaf7e4" stroke="#15820b" stroke-opacity="0.5"/>
          <text x="717" y="451" font-family="Manrope" font-size="9" fill="#15820b">◆ Expanding doesn't call the LLM</text>
        </g>

        <!-- STEP 5: Strategy -->
        <g>
          <rect x="920" y="175" width="215" height="290" rx="10" fill="#ffffff" stroke="#2c4785" stroke-opacity="0.45"/>
          <circle cx="950" cy="200" r="13" fill="#eef2fb" stroke="#2c4785" stroke-width="1.5"/>
          <text x="950" y="204" font-family="Space Grotesk" font-size="12" font-weight="700" fill="#2c4785" text-anchor="middle">5</text>
          <text x="973" y="198" font-family="Space Grotesk" font-size="13" font-weight="700" fill="#0b1a26">PICK STRATEGY</text>
          <text x="973" y="212" font-family="Manrope" font-size="9" fill="#687684">Your going-in approach</text>

          <text x="932" y="238" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#687684" letter-spacing="1">WHERE</text>
          <rect x="932" y="245" width="190" height="22" rx="4" fill="#eef2fb" stroke="#2c4785" stroke-opacity="0.4"/>
          <text x="942" y="260" font-family="Manrope" font-size="10" fill="#2c4785">Prep Hub → Strategies</text>

          <text x="932" y="284" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#687684" letter-spacing="1">OPTIONS</text>
          <g font-family="Manrope" font-size="10">
            <rect x="932" y="291" width="190" height="20" rx="4" fill="#f6f8fb" stroke="#2c4785" stroke-opacity="0.35"/>
            <text x="942" y="305" fill="#1a2a36">◆ Zero-RB (load WR early)</text>
            <rect x="932" y="313" width="190" height="20" rx="4" fill="#f6f8fb" stroke="#2c4785" stroke-opacity="0.35"/>
            <text x="942" y="327" fill="#1a2a36">◆ Hero-RB (elite then WR)</text>
            <rect x="932" y="335" width="190" height="20" rx="4" fill="#f6f8fb" stroke="#2c4785" stroke-opacity="0.35"/>
