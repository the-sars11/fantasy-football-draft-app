<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FFIntelligence — User Guide (Pre-Draft + Live Draft)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #01060c;
      color: #deedf9;
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 15% 0%, rgba(139, 172, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 100%, rgba(47, 248, 1, 0.06) 0%, transparent 50%);
    }
    body { padding: 2rem; }
    .container { max-width: 1400px; margin: 0 auto; }
    .header { margin-bottom: 1.5rem; }
    .header-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem; }
    .pulse-dot {
      width: 10px; height: 10px; border-radius: 50%; background: #2ff801;
      box-shadow: 0 0 12px rgba(47, 248, 1, 0.7); animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(1.15); } }
    h1 {
      font-family: 'Space Grotesk', sans-serif; font-size: 1.75rem; font-weight: 700;
      letter-spacing: -0.02em; color: #ffffff; text-transform: uppercase;
    }
    h1 .accent { color: #2ff801; }
    .subtitle {
      font-family: 'Manrope', sans-serif; font-size: 0.82rem; color: #9eadb8;
      text-transform: uppercase; letter-spacing: 0.14em; margin-left: 22px;
    }
    .meta { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: #697782; margin-top: 0.5rem; margin-left: 22px; }
    .diagram-container {
      background: linear-gradient(180deg, #031018 0%, #050e17 100%);
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: 0 0 60px rgba(139, 172, 255, 0.08), inset 0 0 0 1px rgba(255,255,255,0.04);
      overflow: auto; margin-bottom: 1.5rem;
    }
    svg { display: block; width: 100%; height: auto; min-width: 1400px; }
    .footer {
      text-align: center; margin-top: 1rem; color: #3c4a53; font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace; letter-spacing: 0.08em;
    }
    @media print {
      @page { size: 17in 26in; margin: 0.4in; }
      body { padding: 0; background: #01060c; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .container { max-width: 100%; }
      .diagram-container { overflow: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>FF<span class="accent">Intelligence</span> — User Guide</h1>

    <div class="diagram-container">

            <stop offset="100%" stop-color="#2ff801" stop-opacity="0.02"/>

          <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">

        </defs>

        <rect x="0" y="0" width="1400" height="2100" fill="#031018"/>

        <!-- ============================================== -->

        <!-- ============================================== -->

        <g font-family="Manrope" font-size="10" fill="#deedf9">
